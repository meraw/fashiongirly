name: Deploy Pages
# Runs on every merge to main (and by hand from the Actions tab). Besides the site, it publishes app.zip, the whole
# build: the Android app downloads it when version.json is newer than its copy, so new garments reach the phone without
# a new APK.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# Two jobs, as GitHub's own Pages workflow has them: build uploads the site, then deploy publishes it. With both steps in
# one job the deploy sometimes asked for the upload seconds after it finished and found none (21 and 24 November 2026:
# "Found 0 artifact(s)"), and re-running that job uploaded a second copy, which the deploy also refuses (5 November). Now
# the deploy runs after the build job has finished, and re-running only the deploy job reuses the one upload.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: version.json counts the commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack the app for the Android app
        run: cd dist && zip -qrX ../app.zip . && mv ../app.zip app.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
